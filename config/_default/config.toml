# Kotodama Theme - Default Configuration
# Override these values in your site's config file

[params]
  # Site description (displayed in footer)
  description = ""

  # Author name (displayed in footer)
  author = ""

  # Author biography (displayed in footer)
  authorBio = ""

  # Footer note/theme attribution
  # Leave empty to show default "Kotodama theme by carmelolg"
  footerNote = ""

  # Contact email
  email = ""

  # Website URL
  website = ""

  # Social links (array of objects)
  # Example:
  # socialLinks = [
  #   { name = "GitHub", url = "https://github.com/username" },
  #   { name = "Twitter", url = "https://twitter.com/username" }
  # ]
  socialLinks = []

  # Favicon path (optional)
  favicon = ""

  # Optional Google Analytics 4 ID fallback.
  # Recommended approach is [services.googleAnalytics].ID in your site config.
  # If Analytics is configured, the theme shows a GDPR banner and waits for consent.
  googleAnalyticsID = ""

  # Date format for posts
  dateFormat = "02 Jan 2006"

  # Home page intro heading
  homeIntroHeading = ""

  # Home page intro text
  homeIntroText = ""

  # Show tags in article pages
  showTags = true

[outputs]
  home = ["HTML", "JSON"]

[taxonomies]
  tag = "tags"
