<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <div class="header-actions">
      <nav>
        <ul>
          {{ range .Site.Menus.main }}
            {{ $active := or (eq .URL ($.RelPermalink | relLangURL)) (eq .URL $.RelPermalink) }}
            <li><a href="{{ .URL | relLangURL }}" {{ if $active }}class="active"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Attiva tema scuro o chiaro" title="Attiva tema scuro o chiaro"></button>
    </div>
  </div>
</header>
