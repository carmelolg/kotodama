name: Build Hugo Theme

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build exampleSite
        working-directory: exampleSite
        run: hugo --themesDir ../.. --gc --verbose

      - name: Check output
        working-directory: exampleSite
        run: test -d public && echo "✅ Build successful" || (echo "❌ Build failed" && exit 1)
