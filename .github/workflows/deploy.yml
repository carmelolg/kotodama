name: Deploy exampleSite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo
        working-directory: exampleSite
        run: hugo --minify --themesDir ../.. --baseURL="https://carmelolg.github.io/kotodama/"

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.email "copilot@github.com"
          git config --global user.name "Copilot"
          git fetch origin gh-pages || true
          git checkout -b gh-pages origin/gh-pages || git checkout --orphan gh-pages
          git rm -rf .
          cp -r exampleSite/public/* .
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: deploy to github pages" && git push -u origin gh-pages)
